# Arma la Administración web (PWA) de LonDuo POS y la sube a Cloudflare (Worker `londuo-admin`), sin zip ni Terminal.
# Se lanza a mano: GitHub → Actions → «Publicar web (Administración)» → Run workflow (sirve desde cualquier computadora o el teléfono).
# Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN (plantilla «Edit Cloudflare Workers») y CLOUDFLARE_ACCOUNT_ID.
# La llave de Supabase y la de las notificaciones que van en la página son PÚBLICAS (publishable / VAPID pública); nunca se usa la service_role.
name: Publicar web (Administración)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-web
  cancel-in-progress: false

env:
  LONDUO_SUPABASE_URL: https://zchgpakvhrdpabvsxpnn.supabase.co
  LONDUO_SUPABASE_KEY: sb_publishable_WM9ocZUyxqWSN9qugQ3B2A_8x2Yo8c5
  LONDUO_VAPID_PUBLICA: BIg7RfysxyQUb1EQN7LuBvLYYne52NsflBUiLDTr4I4J8EttMrDksTva7wQD_gXAVq4mWK7xOuDkJzytbqJY88Q
  WORKER: londuo-admin
  URL_PUBLICA: https://londuo-admin.edgardomc.workers.dev

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Armar la página
        run: |
          node scripts/construir-admin.mjs --pwa
          ls -l dist/admin-web
          # Ningún archivo debe acercarse a los límites de Cloudflare (la página de subida manual se atora con archivos grandes).
          if find dist/admin-web -type f -size +2000k | grep -q .; then echo "::error::hay un archivo de más de 2 MB en la web"; exit 1; fi
          # Nunca va una llave secreta en la página.
          if grep -rIl "service_role\\":\\|eyJhbGciOi" dist/admin-web | grep -q .; then echo "::error::la página trae una llave JWT"; exit 1; fi
      - name: Subir a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name "$WORKER" --compatibility-date 2026-10-01 --assets ./dist/admin-web
      - name: Comprobar la versión publicada
        run: |
          esperada=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            vista=$(curl -fsS "$URL_PUBLICA/sw.js" | grep -o "VERSION = '[^']*'" | head -1 || true)
            echo "intento $i: $vista (esperada $esperada)"
            case "$vista" in *"$esperada"*) echo "✅ La web quedó en la versión $esperada"; exit 0;; esac
            sleep 10
          done
          echo "::error::la web publicada no dice la versión $esperada"; exit 1
